services:
  api:
    build:
      target: runner
    command: node dist/src/main
    environment:
      NODE_ENV: production
    volumes: []
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  postgres:
    ports: []
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
