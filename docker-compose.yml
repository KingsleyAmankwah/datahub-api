services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npm run start:dev
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://datahub:secret@postgres:5432/datahub_db
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datahub

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datahub
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: datahub_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U datahub -d datahub_db']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - datahub

volumes:
  postgres_data:

networks:
  datahub:
    driver: bridge
